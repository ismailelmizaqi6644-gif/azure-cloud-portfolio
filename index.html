<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ismail El Mizaqi | Cloud Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- Top Bar: Languages & Download CV & Logout -->
        <div class="top-bar">
            <a href="cv.pdf" class="btn-cv" id="btn-cv" download><i class="fas fa-file-arrow-down"></i> Télécharger CV</a>
            
            <div class="right-controls">
                <div class="lang-switcher">
                    <button onclick="changeLanguage('fr', event)" class="lang-btn active">FR</button>
                    <button onclick="changeLanguage('en', event)" class="lang-btn">EN</button>
                    <button onclick="changeLanguage('ar', event)" class="lang-btn">AR</button>
                </div>
                <a href="/.auth/logout?post_logout_redirect_uri=/" class="btn-logout" title="Déconnexion">
                    <i class="fas fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <!-- Header Profile -->
        <header class="profile-card">
            <div class="avatar">
                <img src="profile.jpg" alt="Ismail El Mizaqi" class="profile-img">
            </div>
            <h1>Ismail El Mizaqi</h1>
            <p class="subtitle" id="txt-subtitle">Technicien Spécialisé en Infrastructure Digitale</p>
            <span class="badge" id="txt-badge">Option Cloud Computing</span>

            <div class="social-links">
                <a href="https://www.linkedin.com/in/ismail-el-mizaqi-71105641b" target="_blank" class="btn-linkedin">
                    <i class="fab fa-linkedin"></i> <span id="txt-linkedin">Profil LinkedIn</span>
                </a>
            </div>
        </header>

        <!-- Navigation Buttons -->
        <nav class="menu-grid">
            <button class="menu-btn btn-blue" onclick="openModal('about-modal')">
                <i class="fas fa-user-circle"></i>
                <span id="btn-about">À propos de moi</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>

            <button class="menu-btn btn-purple" onclick="openModal('projects-modal')">
                <i class="fas fa-diagram-project"></i>
                <span id="btn-projects">Mes Projets</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>

            <button class="menu-btn btn-yellow" onclick="openModal('skills-modal')">
                <i class="fas fa-laptop-code"></i>
                <span id="btn-skills">Compétences Techniques</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>

            <button class="menu-btn btn-red" onclick="openModal('certs-modal')">
                <i class="fas fa-award"></i>
                <span id="btn-certs">Certifications & Attestations</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>

            <button class="menu-btn btn-green" onclick="openModal('contact-modal')">
                <i class="fas fa-paper-plane"></i>
                <span id="btn-contact">Me Contacter (Formulaire)</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>
        </nav>

        <footer>
            <p>© 2026 Ismail El Mizaqi | Propulsé par Microsoft Azure</p>
        </footer>
    </div>

    <!-- ===== MODALS ===== -->

    <!-- 1. À propos de moi -->
    <div id="about-modal" class="modal">
        <div class="modal-content border-blue">
            <span class="close-btn" onclick="closeModal('about-modal')">&times;</span>
            <h2><i class="fas fa-user-circle text-blue"></i> <span id="modal-about-title">À propos de moi</span></h2>
            <div class="modal-body" id="modal-about-body" style="margin-top: 15px;"></div>
        </div>
    </div>

    <!-- 2. Mes Projets -->
    <div id="projects-modal" class="modal">
        <div class="modal-content border-purple">
            <span class="close-btn" onclick="closeModal('projects-modal')">&times;</span>
            <h2 style="margin-bottom: 15px;"><i class="fas fa-diagram-project text-purple"></i> <span id="modal-projects-title">Mes Projets</span></h2>
            <div class="modal-body" id="modal-projects-body"></div>
        </div>
    </div>

    <!-- 3. Compétences Techniques -->
    <div id="skills-modal" class="modal">
        <div class="modal-content border-yellow">
            <span class="close-btn" onclick="closeModal('skills-modal')">&times;</span>
            <h2 style="margin-bottom: 15px;"><i class="fas fa-laptop-code text-yellow"></i> <span id="modal-skills-title">Compétences Techniques</span></h2>
            <div class="modal-body" id="modal-skills-body"></div>
        </div>
    </div>

    <!-- 4. Certifications & Attestations -->
    <div id="certs-modal" class="modal">
        <div class="modal-content border-red">
            <span class="close-btn" onclick="closeModal('certs-modal')">&times;</span>
            <h2 style="margin-bottom: 15px;"><i class="fas fa-award text-red"></i> <span id="modal-certs-title">Certifications & Attestations</span></h2>
            <div class="modal-body" id="modal-certs-body"></div>
        </div>
    </div>

    <!-- 5. Formulaire de Contact -->
    <div id="contact-modal" class="modal">
        <div class="modal-content border-green">
            <span class="close-btn" onclick="closeModal('contact-modal')">&times;</span>
            <h2 style="margin-bottom: 15px;"><i class="fas fa-envelope text-green"></i> <span id="modal-contact-title">Contactez-moi</span></h2>
            <div class="modal-body">
                <div id="form-alert" class="alert-box" style="display: none;"></div>
                <form id="contact-form" onsubmit="handleFormSubmit(event)">
                    <div class="form-group">
                        <label id="lbl-name">Nom complet :</label>
                        <input type="text" id="input-name" name="name" required placeholder="Votre nom">
                    </div>
                    <div class="form-group">
                        <label id="lbl-email">Adresse Email :</label>
                        <input type="email" id="input-email" name="email" required placeholder="exemple@mail.com">
                    </div>
                    <div class="form-group">
                        <label id="lbl-message">Message :</label>
                        <textarea id="input-message" name="message" rows="4" required placeholder="Votre message..."></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="btn-send">Envoyer le message</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        function openModal(id) { 
            document.getElementById(id).style.display = "flex"; 
        }
        
        function closeModal(id) { 
            document.getElementById(id).style.display = "none";
            document.getElementById('form-alert').style.display = "none";
        }
        
        window.onclick = function(e) {
            if (e.target.classList.contains('modal')) { 
                closeModal(e.target.id); 
            }
        }

        async function handleFormSubmit(event) {
            event.preventDefault();
            const btn = document.getElementById('btn-send');
            const alertBox = document.getElementById('form-alert');

            const formData = {
                name: document.getElementById('input-name').value,
                email: document.getElementById('input-email').value,
                message: document.getElementById('input-message').value,
                date: new Date().toISOString()
            };

            btn.disabled = true;
            btn.innerText = "Envoi en cours...";

            try {
                const response = await fetch("/api/sendMessage", {
                    method: "POST",
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(formData)
                });

                if (response.ok) {
                    alertBox.className = "alert-box alert-success";
                    alertBox.innerText = "Message envoyé avec succès !";
                    alertBox.style.display = "block";
                    document.getElementById('contact-form').reset();

                    setTimeout(() => {
                        closeModal('contact-modal');
                        btn.disabled = false;
                        btn.innerText = "Envoyer le message";
                    }, 2500);
                } else {
                    throw new Error("Erreur lors de l'envoi");
                }
            } catch (error) {
                alertBox.className = "alert-box alert-error";
                alertBox.innerText = "Désolé, une erreur est survenue. Réessayez!";
                alertBox.style.display = "block";
                btn.disabled = false;
                btn.innerText = "Envoyer le message";
            }
        }

        const translations = {
            fr: {
                subtitle: "Technicien Spécialisé en Infrastructure Digitale",
                badge: "Option Cloud Computing",
                cvBtn: "Télécharger CV",
                aboutBtn: "À propos de moi",
                projectsBtn: "Mes Projets",
                skillsBtn: "Compétences Techniques",
                certsBtn: "Certifications & Attestations",
                contactBtn: "Me Contacter (Formulaire)",
                contactTitle: "Contactez-moi",
                aboutTitle: "À propos de moi",
                projectsTitle: "Mes Projets",
                skillsTitle: "Compétences Techniques",
                certsTitle: "Certifications & Attestations",
                lblName: "Nom complet :",
                lblEmail: "Adresse Email :",
                lblMessage: "Message :",
                btnSend: "Envoyer le message",
                aboutBody: "<p>Bonjour, c'est un plaisir de me présenter. Je m'appelle <strong>Ismail El Mizaqi</strong>, étudiant en <strong>Infrastructure Digitale (Option Cloud Computing)</strong> à l'NTIC Safi (OFPPT).</p><p style='margin-top: 10px;'>Je me spécialise dans la conception et la sécurisation des réseaux informatiques ainsi que la gestion des environnements Cloud (sur des plateformes telles que <strong>Microsoft Azure</strong> et <strong>AWS</strong>), en plus de l'administration <strong>Linux & Windows Server</strong> et l'automatisation des infrastructures. J'ambitionne constamment de développer mes compétences et de les appliquer sur des projets concrets.</p>",
                projectsBody: `
                    <div class="skill-box">
                        <h3><i class="fas fa-cloud text-blue"></i> Azure Static Web App & CI/CD</h3>
                        <p>Déploiement d'un portfolio interactif sécurisé hébergé sur Microsoft Azure avec automatisation via GitHub Actions.</p>
                    </div>
                    <div class="skill-box">
                        <h3><i class="fas fa-server text-yellow"></i> Administration Linux & Services Réseau</h3>
                        <p>Configuration de serveurs Ubuntu (SSH, Telnet, Table de routage) et gestion du réseau local pour un environnement sécurisé.</p>
                    </div>`,
                skillsBody: `
                    <div class="skill-box">
                        <h3>Cloud & Virtualisation</h3>
                        <p>Microsoft Azure, Virtual Machines, Azure Static Web Apps</p>
                    </div>
                    <div class="skill-box">
                        <h3>Systèmes & Réseaux</h3>
                        <p>Linux (Ubuntu/Debian), Windows Server, Adressage IP, Routing, SSH & Telnet</p>
                    </div>
                    <div class="skill-box">
                        <h3>DevOps & Outils</h3>
                        <p>Git, GitHub Actions, CI/CD Workflows</p>
                    </div>`,
                certsBody: `
                    <div class="skill-box">
                        <h3><i class="fab fa-microsoft text-blue"></i> Microsoft Azure Fundamentals (AZ-900)</h3>
                        <p><em>En cours de préparation</em> - Validation des concepts Cloud, sécurité et services Azure.</p>
                    </div>
                    <div class="skill-box">
                        <h3><i class="fas fa-graduation-cap text-yellow"></i> Diplôme TS en Infrastructure Digitale</h3>
                        <p>OFPPT - Spécialité Cloud Computing <em>(En cours d'obtention)</em></p>
                    </div>`
            },
            en: {
                subtitle: "Specialized Technician in Digital Infrastructure",
                badge: "Cloud Computing Option",
                cvBtn: "Download CV",
                aboutBtn: "About Me",
                projectsBtn: "My Projects",
                skillsBtn: "Technical Skills",
                certsBtn: "Certifications & Credentials",
                contactBtn: "Contact Me (Form)",
                contactTitle: "Contact Me",
                aboutTitle: "About Me",
                projectsTitle: "My Projects",
                skillsTitle: "Technical Skills",
                certsTitle: "Certifications & Credentials",
                lblName: "Full Name:",
                lblEmail: "Email Address:",
                lblMessage: "Message:",
                btnSend: "Send Message",
                aboutBody: "<p>Hello, I am pleased to introduce myself. My name is <strong>Ismail El Mizaqi</strong>, studying <strong>Digital Infrastructure (Cloud Computing Option)</strong> at NTIC Safi (OFPPT).</p><p style='margin-top: 10px;'>I specialize in designing and securing computer networks and managing Cloud environments (on platforms such as <strong>Microsoft Azure</strong> and <strong>AWS</strong>), alongside <strong>Linux & Windows Server</strong> administration and infrastructure automation. I constantly strive to develop my skills and apply them to promising practical projects.</p>",
                projectsBody: `
                    <div class="skill-box">
                        <h3><i class="fas fa-cloud text-blue"></i> Azure Static Web App & CI/CD</h3>
                        <p>Deployment of a secure interactive portfolio hosted on Microsoft Azure with automation via GitHub Actions.</p>
                    </div>
                    <div class="skill-box">
                        <h3><i class="fas fa-server text-yellow"></i> Linux Administration & Network Services</h3>
                        <p>Configuration of Ubuntu servers (SSH, Telnet, Routing Tables) and local network management for a secure environment.</p>
                    </div>`,
                skillsBody: `
                    <div class="skill-box">
                        <h3>Cloud & Virtualization</h3>
                        <p>Microsoft Azure, Virtual Machines, Azure Static Web Apps</p>
                    </div>
                    <div class="skill-box">
                        <h3>Systems & Networks</h3>
                        <p>Linux (Ubuntu/Debian), Windows Server, IP Addressing, Routing, SSH & Telnet</p>
                    </div>
                    <div class="skill-box">
                        <h3>DevOps & Tools</h3>
                        <p>Git, GitHub Actions, CI/CD Workflows</p>
                    </div>`,
                certsBody: `
                    <div class="skill-box">
                        <h3><i class="fab fa-microsoft text-blue"></i> Microsoft Azure Fundamentals (AZ-900)</h3>
                        <p><em>In preparation</em> - Validation of Cloud concepts, security, and Azure services.</p>
                    </div>
                    <div class="skill-box">
                        <h3><i class="fas fa-graduation-cap text-yellow"></i> Specialized Technician Diploma in Digital Infrastructure</h3>
                        <p>OFPPT - Cloud Computing Specialty <em>(In progress)</em></p>
                    </div>`
            },
            ar: {
                subtitle: "تقني متخصص في البنية التحتية الرقمية",
                badge: "خيار الحوسبة السحابية (Cloud Computing)",
                cvBtn: "تحميل السيرة الذاتية",
                aboutBtn: "نبذة عني",
                projectsBtn: "مشاريعي",
                skillsBtn: "المهارات التقنية",
                certsBtn: "الشهادات والشواهد",
                contactBtn: "تواصل معي (استمارة)",
                contactTitle: "تواصل معي",
                aboutTitle: "نبذة عني",
                projectsTitle: "مشاريعي",
                skillsTitle: "المهارات التقنية",
                certsTitle: "الشهادات والشواهد",
                lblName: "الاسم الكامل:",
                lblEmail: "البريد الإلكتروني:",
                lblMessage: "الرسالة:",
                btnSend: "إرسال الرسالة",
                aboutBody: "<p>مرحباً، يشرفني أن أعرّفكم بنفسي. اسمي <strong>إسماعيل الميزاقي</strong>، طالب بشعبة <strong>البنية التحتية الرقمية (خيار الحوسبة السحابية)</strong> بالمعهد المتخصص في تقنيات الإعلام والتواصل بآسفي (<strong>NTIC Safi - OFPPT</strong>).</p><p style='margin-top: 10px;'>أتخصص في تصميم وتأمين شبكات المعلومات وإدارة الأنظمة السحابية (على منصات مثل <strong>Microsoft Azure</strong> و <strong>AWS</strong>)، بالإضافة إلى إدارة سيرفرات <strong>Linux & Windows Server</strong> وأتمتة البنيات التحتية لتوفير حلول رقمية متكاملة وعالية الأداء. وأطمح باستمرار لتطوير مهاراتي وتطبيقها في مشاريع عملية واعدة.</p>",
                projectsBody: `
                    <div class="skill-box">
                        <h3><i class="fas fa-cloud text-blue"></i> Azure Static Web App & CI/CD</h3>
                        <p>نشر موقع شخصي تفاعلي وآمن مستضاف على Microsoft Azure مع الأتمتة باستخدام GitHub Actions.</p>
                    </div>
                    <div class="skill-box">
                        <h3><i class="fas fa-server text-yellow"></i> إدارة أنظمة Linux وخدمات الشبكة</h3>
                        <p>إعداد خوادم Ubuntu (SSH, Telnet, جدول التوجيه Routing Table) وإدارة الشبكة المحلية لبيئة آمنة.</p>
                    </div>`,
                skillsBody: `
                    <div class="skill-box">
                        <h3>الحوسبة السحابية والافتراضية (Cloud & Virtualization)</h3>
                        <p>Microsoft Azure, Virtual Machines, Azure Static Web Apps</p>
                    </div>
                    <div class="skill-box">
                        <h3>الأنظمة والشبكات</h3>
                        <p>Linux (Ubuntu/Debian), Windows Server, العنونة IP, Routing, SSH & Telnet</p>
                    </div>
                    <div class="skill-box">
                        <h3>DevOps والأدوات</h3>
                        <p>Git, GitHub Actions, مسارات العمل CI/CD</p>
                    </div>`,
                certsBody: `
                    <div class="skill-box">
                        <h3><i class="fab fa-microsoft text-blue"></i> Microsoft Azure Fundamentals (AZ-900)</h3>
                        <p><em>قيد التحضير</em> - إثبات المفاهيم السحابية، الأمان، وخدمات Azure.</p>
                    </div>
                    <div class="skill-box">
                        <h3><i class="fas fa-graduation-cap text-yellow"></i> دبلوم تقني متخصص في البنية التحتية الرقمية</h3>
                        <p>مؤسسة OFPPT - تخصص الحوسبة السحابية <em>(في طور الإنجاز)</em></p>
                    </div>`
            }
        };

        function changeLanguage(lang, evt) {
            if (evt) {
                document.querySelectorAll('.lang-btn').forEach(btn => btn.classList.remove('active'));
                evt.target.classList.add('active');
            }

            // التبديل بين اليمين واليسار فـ اتجاه النص
            if(lang === 'ar') {
                document.documentElement.dir = "rtl";
                document.documentElement.lang = "ar";
            } else {
                document.documentElement.dir = "ltr";
                document.documentElement.lang = lang;
            }

            const t = translations[lang];
            
            // Header & Buttons
            document.getElementById('txt-subtitle').innerText = t.subtitle;
            document.getElementById('txt-badge').innerText = t.badge;
            document.getElementById('btn-cv').innerHTML = `<i class="fas fa-file-arrow-down"></i> ${t.cvBtn}`;
            document.getElementById('btn-about').innerText = t.aboutBtn;
            document.getElementById('btn-projects').innerText = t.projectsBtn;
            document.getElementById('btn-skills').innerText = t.skillsBtn;
            document.getElementById('btn-certs').innerText = t.certsBtn;
            document.getElementById('btn-contact').innerText = t.contactBtn;
            
            // Modal Titles
            document.getElementById('modal-about-title').innerText = t.aboutTitle;
            document.getElementById('modal-projects-title').innerText = t.projectsTitle;
            document.getElementById('modal-skills-title').innerText = t.skillsTitle;
            document.getElementById('modal-certs-title').innerText = t.certsTitle;
            document.getElementById('modal-contact-title').innerText = t.contactTitle;

            // Form Labels
            document.getElementById('lbl-name').innerText = t.lblName;
            document.getElementById('lbl-email').innerText = t.lblEmail;
            document.getElementById('lbl-message').innerText = t.lblMessage;
            document.getElementById('btn-send').innerText = t.btnSend;

            // Dynamic Modal Bodies
            document.getElementById('modal-about-body').innerHTML = t.aboutBody;
            document.getElementById('modal-projects-body').innerHTML = t.projectsBody;
            document.getElementById('modal-skills-body').innerHTML = t.skillsBody;
            document.getElementById('modal-certs-body').innerHTML = t.certsBody;
        }

        // Initialize default language
        changeLanguage('fr');
    </script>
</body>
</html>
