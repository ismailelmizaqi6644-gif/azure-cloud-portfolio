<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ismail El Mizaqi | Cloud Portfolio</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <div class="container">
        <!-- Top Bar: Languages & Download CV & Logout -->
        <div class="top-bar">
            <a href="cv.pdf" class="btn-cv" id="btn-cv" download><i class="fas fa-file-arrow-down"></i> Télécharger CV</a>
            
            <div class="right-controls">
                <div class="lang-switcher">
                    <button onclick="changeLanguage('fr', event)" class="lang-btn active">FR</button>
                    <button onclick="changeLanguage('en', event)" class="lang-btn">EN</button>
                    <button onclick="changeLanguage('ar', event)" class="lang-btn">AR</button>
                </div>
                <a href="/.auth/logout?post_logout_redirect_uri=/" class="btn-logout" title="Déconnexion">
                    <i class="fas fa-right-from-bracket"></i>
                </a>
            </div>
        </div>

        <!-- Header Profile -->
        <header class="profile-card">
            <div class="avatar">
                <img src="profile.jpg" alt="Ismail El Mizaqi" class="profile-img">
            </div>
            <h1>Ismail El Mizaqi</h1>
            <p class="subtitle" id="txt-subtitle">Technicien Spécialisé en Infrastructure Digitale</p>
            <span class="badge" id="txt-badge">Option Cloud Computing</span>

            <div class="social-links">
                <a href="https://www.linkedin.com/in/ismail-el-mizaqi-71105641b" target="_blank" class="btn-linkedin">
                    <i class="fab fa-linkedin"></i> <span id="txt-linkedin">Profil LinkedIn</span>
                </a>
            </div>
        </header>

        <!-- Navigation Buttons -->
        <nav class="menu-grid">
            <button class="menu-btn btn-blue" onclick="openModal('about-modal')">
                <i class="fas fa-user-circle"></i>
                <span id="btn-about">À propos de moi</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>

            <button class="menu-btn btn-purple" onclick="openModal('projects-modal')">
                <i class="fas fa-diagram-project"></i>
                <span id="btn-projects">Mes Projets</span>
                <i class="fas fa-arrow-right arrow"></i>
            </button>
